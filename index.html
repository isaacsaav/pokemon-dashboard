<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon Market Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #edf2f4;
    --panel: #ffffff;
    --ink: #20313b;
    --muted: #647681;
    --line: #d8e1e5;
    --accent: #167e78;
    --up: #218354;
    --down: #c34d48;
    --row-hover: #f2f7f7;
    --row-active: #e7f3f1;
    --nav: #173746;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101a20; --panel: #18262d; --ink: #e8f0f2; --muted: #a0b1b7; --line: #30434b;
      --accent: #53b9ad; --up: #58c58c; --down: #fa8278; --row-hover: #20323a; --row-active: #23423f;
      --nav: #0c171c;
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: 0 0 max(22px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 22px 24px 0; }
  .site-header { background: var(--nav); color: #fff; border-bottom: 4px solid #39a99b; }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: 18px 24px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .brand-kicker { color: #a9d4d0; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
  h1 { font-size: clamp(23px, 4vw, 31px); font-weight: 750; letter-spacing: -0.025em; margin: 0; line-height: 1.1; }
  .updated { color: #d0e0e2; font-size: 13px; white-space: nowrap; }
  .banner { background: #fff3cd; color: #5c4400; border: 1px solid #e8d48a; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; padding: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 2px #1737460d; }
  .toolbar button {
    font: inherit; font-size: 13px; font-weight: 650; padding: 7px 13px; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .toolbar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar .spacer { flex: 1 1 10px; }
  .toolbar select {
    font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; max-width: 100%;
  }
  .search { flex: 1 1 210px; min-width: 170px; max-width: 330px; font: inherit; font-size: 13px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); }
  input:focus-visible, select:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent); outline-offset: 1px; }
  button:focus-visible, .row:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: -2px; }
  .era-line { color: var(--muted); font-size: 13px; margin-top: 3px; }

  .layout { display: grid; grid-template-columns: minmax(350px, 1.03fr) minmax(0, 1.4fr); gap: 16px; align-items: start; }
  @media (max-width: 850px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; box-shadow: 0 1px 3px #1737460c; }
  .list-heading { display: grid; grid-template-columns: 1fr auto 82px; gap: 14px; padding: 10px 14px; background: #f3f6f7; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  @media (prefers-color-scheme: dark) { .list-heading { background: #203039; } }
  .row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center;
    padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; background: transparent;
    width: 100%; text-align: left; border-left: 0; border-right: 0; border-top: 0; font: inherit; color: inherit;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--row-hover); }
  .row[aria-current="true"] { background: var(--row-active); box-shadow: inset 4px 0 0 var(--accent); }
  .collection-heading { padding: 9px 14px 6px; color: var(--muted); background: var(--row-hover); font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  .name { font-weight: 650; font-size: 13px; line-height: 1.3; }
  .kind { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .price { font-weight: 750; font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
  .chg { font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
  .chg b { font-weight: 600; }
  .up { color: var(--up); } .down { color: var(--down); }
  .cols { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }

  .detail { padding: 20px; }
  .detail h2 { margin: 0; font-size: 21px; font-weight: 750; letter-spacing: -0.015em; }
  .card-meta { display: flex; align-items: center; gap: 14px; margin: 16px 0; padding: 12px; background: var(--row-hover); border: 1px solid var(--line); border-radius: 6px; }
  .card-meta img { display: block; width: 96px; max-height: 134px; object-fit: contain; border-radius: 5px; }
  .card-rarity { color: var(--muted); font-size: 13px; }
  .price-label { color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; margin-top: 13px; }
  .big { font-size: 35px; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 2px 0 8px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin: 8px 0 18px; }
  .stats span { padding: 8px 10px; background: var(--row-hover); border: 1px solid var(--line); border-radius: 5px; }
  .stats b { color: var(--ink); font-weight: 600; }
  .chart-title { margin: 18px 0 8px; font-size: 14px; font-weight: 700; }
  .ranges { display: flex; gap: 5px; margin-bottom: 8px; }
  .ranges button { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .ranges button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .chart-box { position: relative; height: 260px; }
  .empty { padding: 32px 18px; color: var(--muted); text-align: center; }
  footer { color: var(--muted); font-size: 12px; margin-top: 16px; }
  @media (max-width: 560px) {
    .header-inner { align-items: flex-start; flex-direction: column; padding: 15px 18px; }
    .wrap { padding: 14px 12px 0; }
    .toolbar { padding: 9px; }
    .toolbar .spacer { display: none; }
    .search { flex-basis: 100%; max-width: none; order: -1; }
    .layout { gap: 12px; }
    .row { grid-template-columns: minmax(0, 1fr) auto; gap: 9px; }
    .row .cols { display: none; }
    .list-heading { grid-template-columns: 1fr 82px; }
    .list-heading span:nth-child(2) { display: none; }
    .detail { padding: 15px; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div><div class="brand-kicker">Pokémon TCG · Market guide</div><h1>Pokémon card prices</h1></div>
    <div class="updated" id="updated"></div>
  </div>
</header>
<main class="wrap">

  <div id="banner"></div>

  <div class="toolbar" id="filters">
    <button data-filter="all" aria-pressed="true">All</button>
    <button data-filter="card" aria-pressed="false">Cards</button>
    <button data-filter="set" aria-pressed="false">Sets</button>
    <select id="era" aria-label="Filter by era"><option value="all">All eras</option></select>
    <input class="search" id="search" type="search" placeholder="Search cards, Pokémon, or sets" aria-label="Search cards, Pokémon, or sets">
    <span class="spacer"></span>
    <button data-sort="name" aria-pressed="true">Name A–Z</button>
    <button data-sort="move" aria-pressed="false">Biggest 7-day move</button>
  </div>

  <div class="layout">
    <div class="panel" id="list"></div>
    <div class="panel detail" id="detail"></div>
  </div>

  <footer>Raw, ungraded TCGplayer market prices in USD, from pokemontcg.io. Matching card printings are listed; unavailable prices show as N/A. Set totals add available card prices; they are estimates, not sealed-product prices.</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="data/data.js"></script>
<script>
(function () {
  var data = window.PRICE_DATA;
  var listEl = document.getElementById("list");
  var detailEl = document.getElementById("detail");

  if (!data || !data.series || !data.series.length) {
    listEl.innerHTML = '<div class="empty">No data yet. Run <code>python fetch_prices.py</code> (or <code>python fetch_prices.py --demo</code> to preview).</div>';
    detailEl.style.display = "none";
    return;
  }

  document.getElementById("updated").textContent = "Last updated " + data.updated;
  if (data.sample) {
    document.getElementById("banner").innerHTML = '<div class="banner">Showing <b>sample data</b>, not real prices. Run <code>python fetch_prices.py</code> to load real ones.</div>';
  }

  var money = function (n) { return "$" + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var dayMs = 86400000;

  // % change versus the last point on or before N days ago (null if history is too short)
  function change(points, days) {
    var last = points[points.length - 1];
    var target = new Date(last[0]).getTime() - days * dayMs;
    var base = null;
    for (var i = 0; i < points.length; i++) {
      if (new Date(points[i][0]).getTime() <= target) base = points[i];
    }
    if (!base || !base[1]) return null;
    return (last[1] - base[1]) / base[1] * 100;
  }
  function fmtChg(v) {
    if (v === null) return '<span>–</span>';
    var cls = v >= 0 ? "up" : "down";
    return '<span class="' + cls + '">' + (v >= 0 ? "+" : "") + v.toFixed(1) + "%</span>";
  }

  var items = data.series.map(function (s) {
    var pts = s.points.slice().sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
    return { key: s.type + ":" + s.id, type: s.type, era: s.era || "other", label: s.label,
             pokemon: s.pokemon || "", collection: s.collection || "Other",
             rarity: s.rarity || "", image: s.image || "", points: pts,
             price: pts.length ? pts[pts.length - 1][1] : null,
             d7: pts.length ? change(pts, 7) : null, d30: pts.length ? change(pts, 30) : null };
  });

  var state = { filter: "all", era: "all", sort: "name", selected: items[0].key, range: 90 };
  var searchEl = document.getElementById("search");
  var eraById = {};
  (data.eras || []).forEach(function (e) { eraById[e.id] = e; });
  var eraSelect = document.getElementById("era");
  (data.eras || []).forEach(function (e) {
    if (!items.some(function (i) { return i.era === e.id; })) return;  // only eras you actually track
    var o = document.createElement("option");
    o.value = e.id; o.textContent = e.name + (e.years ? " (" + e.years + ")" : "");
    eraSelect.appendChild(o);
  });
  eraSelect.addEventListener("change", function () { state.era = eraSelect.value; renderList(); });
  searchEl.addEventListener("input", renderList);
  var chart = null;

  function renderList() {
    var shown = items.filter(function (i) {
      var query = searchEl.value.trim().toLocaleLowerCase();
      var matchesSearch = !query || [i.label, i.pokemon, i.collection, i.rarity].join(" ").toLocaleLowerCase().indexOf(query) !== -1;
      return matchesSearch && (state.filter === "all" || i.type === state.filter) && (state.era === "all" || i.era === state.era);
    });
    shown.sort(function (a, b) {
      if (state.filter === "set" && a.collection !== b.collection) return a.collection.localeCompare(b.collection);
      if (state.sort === "move") return Math.abs(b.d7 || 0) - Math.abs(a.d7 || 0);
      return a.label.localeCompare(b.label);
    });
    if (!shown.length) {
      if (chart) { chart.destroy(); chart = null; }
      listEl.innerHTML = '<div class="list-heading"><span>Item</span><span>Trend</span><span>Market</span></div><div class="empty">No matching items. Try another search or filter.</div>';
      detailEl.innerHTML = '<div class="empty">Select an item to view its price details.</div>';
      return;
    }
    if (!shown.some(function (i) { return i.key === state.selected; })) state.selected = shown[0].key;
    var previousCollection = null;
    listEl.innerHTML = '<div class="list-heading"><span>Item</span><span>Trend</span><span>Market</span></div>' + shown.map(function (i) {
      var heading = "";
      if (state.filter === "set" && i.collection !== previousCollection) {
        previousCollection = i.collection;
        heading = '<div class="collection-heading">' + i.collection + "</div>";
      }
      return heading + '<button class="row" data-key="' + i.key + '"' + (i.key === state.selected ? ' aria-current="true"' : "") + ">" +
        '<div><div class="name">' + i.label + '</div><div class="kind">' + (i.type === "set" ? "Set total" : i.pokemon + " card") + ", " + i.collection + "</div></div>" +
        '<div class="cols"><div class="chg">7d <b>' + fmtChg(i.d7) + '</b></div><div class="chg">30d <b>' + fmtChg(i.d30) + "</b></div></div>" +
        '<div class="price">' + (i.price === null ? "N/A" : money(i.price)) + "</div></button>";
    }).join("");
    renderDetail();
  }

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function renderDetail() {
    var it = items.filter(function (i) { return i.key === state.selected; })[0];
    if (!it) return;
    var cardMeta = it.type === "card" && (it.image || it.rarity)
      ? '<div class="card-meta">' + (it.image ? '<img src="' + it.image + '" alt="">' : "") +
        (it.rarity ? '<div class="card-rarity">Rarity: ' + it.rarity + "</div>" : "") + "</div>"
      : "";
    if (!it.points.length) {
      if (chart) { chart.destroy(); chart = null; }
      detailEl.innerHTML = "<h2>" + it.label + "</h2>" +
        '<div class="era-line">' + it.collection + "</div>" +
        cardMeta +
        '<div class="empty">No TCGplayer market prices are available for this ' +
        (it.type === "set" ? "set" : "card") + '.</div>';
      return;
    }
    var pts = it.points;
    var cutoff = new Date(pts[pts.length - 1][0]).getTime() - state.range * dayMs;
    var view = pts.filter(function (p) { return new Date(p[0]).getTime() >= cutoff; });
    var prices = view.map(function (p) { return p[1]; });
    var hi = Math.max.apply(null, prices), lo = Math.min.apply(null, prices);

    detailEl.innerHTML =
      "<h2>" + it.label + "</h2>" +
      '<div class="era-line">' + (it.type === "card" ? it.pokemon + " · " : "") + it.collection +
        (eraById[it.era] && eraById[it.era].years ? " · " + eraById[it.era].years : "") + "</div>" +
      cardMeta +
      '<div class="price-label">Current raw market price</div>' +
      '<div class="big">' + money(it.price) + "</div>" +
      '<div class="stats"><span>7 days <b>' + fmtChg(it.d7) + "</b></span><span>30 days <b>" + fmtChg(it.d30) +
      "</b></span><span>High <b>" + money(hi) + "</b></span><span>Low <b>" + money(lo) + "</b></span></div>" +
      '<div class="chart-title">Price history</div>' +
      '<div class="ranges">' + [30, 90, 365].map(function (r) {
        return '<button data-range="' + r + '" aria-pressed="' + (state.range === r) + '">' + (r === 365 ? "1 year" : r + " days") + "</button>";
      }).join("") + "</div>" +
      '<div class="chart-box"><canvas id="chart" role="img" aria-label="Price history for ' + it.label + '"></canvas></div>';

    if (chart) chart.destroy();
    var up = view.length < 2 || view[view.length - 1][1] >= view[0][1];
    var color = up ? css("--up") : css("--down");
    chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: { labels: view.map(function (p) { return p[0]; }),
              datasets: [{ data: prices, borderColor: color, backgroundColor: color + "22", fill: true,
                           tension: 0.25, pointRadius: view.length > 45 ? 0 : 3, borderWidth: 2.5 }] },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) { return money(c.parsed.y); } } } },
        scales: {
          x: { ticks: { maxTicksLimit: 6, color: css("--muted") }, grid: { display: false } },
          y: { ticks: { color: css("--muted"), callback: function (v) { return "$" + v; } }, grid: { color: css("--line") } }
        }
      }
    });
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.key) { state.selected = t.dataset.key; renderList(); }
    else if (t.dataset.filter) { state.filter = t.dataset.filter; mark("filter", t); renderList(); }
    else if (t.dataset.sort) { state.sort = t.dataset.sort; mark("sort", t); renderList(); }
    else if (t.dataset.range) { state.range = +t.dataset.range; renderDetail(); }
  });
  function mark(attr, active) {
    document.querySelectorAll("[data-" + attr + "]").forEach(function (b) {
      b.setAttribute("aria-pressed", b === active ? "true" : "false");
    });
  }

  renderList();
})();
</script>
</body>
</html>
