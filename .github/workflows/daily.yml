name: Daily price update

on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC (about 6-7 AM US Eastern)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: python fetch_prices.py

      - name: Save changes
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update prices $(date -u +%F)"
          git push
